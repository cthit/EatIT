version: '3.8'

services:
  eatit:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - eatit_data:/app/data
    networks:
      - eatit-network

volumes:
  eatit_data:

networks:
  eatit-network:
    driver: bridge
